<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css?v=20261109b" />
    <title>Gem Quest</title>
    <meta name="author" content="toko" />
    <style type="text/css"> body { background-color:#202850; }</style>
    
  </head>
  <body>
    <main class="player-page">
      <header class="player-header">
        <h1>Gem Quest</h1>
        <span>GAME BOY COLOR</span>
      </header>
      <section class="player-stage">
    <div class="chromatic" aria-label="Gem Quest game device">
      <div class="device-topline">
        <span>MODRETRO</span><span>CHROMATIC</span>
      </div>
      <div class="screen-bezel">
        <div class="screen-label">DOT MATRIX WITH STEREO SOUND</div>
        <div id="game">
          <canvas id="mainCanvas" width="256" height="224">No Canvas Support</canvas>
        </div>
        <div class="power-led" aria-hidden="true"></div>
      </div>
      <div class="device-mark"><strong>GEM QUEST</strong><span>GAME BOY COLOR ADVENTURE</span></div>
      <div class="hardware-controls" aria-hidden="true">
        <div class="dpad-ornament"><i></i></div>
        <div class="button-ornament"><b>B</b><b>A</b></div>
        <div class="small-buttons"><i>SELECT</i><i>START</i></div>
        <div id="controller" aria-label="Game controls">
          <div id="controller_dpad">
            <div id="controller_left"></div>
            <div id="controller_right"></div>
            <div id="controller_up"></div>
            <div id="controller_down"></div>
          </div>
          <div id="controller_select" class="capsuleBtn">Select</div>
          <div id="controller_start" class="capsuleBtn">Start</div>
          <div id="controller_b" class="roundBtn">B</div>
          <div id="controller_a" class="roundBtn">A</div>
        </div>
      </div>
      <p class="keyboard-help">Arrow keys: move &nbsp;•&nbsp; Z: A / interact &nbsp;•&nbsp; Enter: Start</p>
    </div>
    <div class="player-tools" aria-label="Player options">
      <div class="color-row" aria-label="Console colors">
        <button type="button" class="console-swatch is-selected" data-shell="cloud" aria-label="Cloud console"></button>
        <button type="button" class="console-swatch" data-shell="midnight" aria-label="Midnight console"></button>
        <button type="button" class="console-swatch" data-shell="wave" aria-label="Wave console"></button>
        <button type="button" class="console-swatch" data-shell="leaf" aria-label="Leaf console"></button>
        <button type="button" class="console-swatch" data-shell="inferno" aria-label="Inferno console"></button>
        <button type="button" class="console-swatch" data-shell="volt" aria-label="Volt console"></button>
        <button type="button" class="console-swatch" data-shell="bubblegum" aria-label="Bubblegum console"></button>
      </div>
      <div class="player-action-row">
        <button type="button" class="player-action" data-player-action="sound" aria-label="Toggle sound">🔊</button>
        <button type="button" class="player-action" data-player-action="pause" aria-label="Pause game">Ⅱ</button>
        <button type="button" class="player-action" data-player-action="restart" aria-label="Restart game">↻</button>
        <button type="button" class="player-action" data-player-action="fullscreen" aria-label="Toggle fullscreen">⛶</button>
      </div>
      <p class="official-help">Click the console to use your keyboard, or press its buttons.</p>
    </div>
      </section>
    </main>
    <script src="js/binjgb.js"></script>
    <script src="js/script.js"></script>
    <script src="js/debugger.js"></script>
</body>
